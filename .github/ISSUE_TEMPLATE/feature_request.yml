name: Feature request
description: Suggest a feature, metric or visual.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to understand or do that the app doesn't help with today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: For new analytics, link the research it relies on. Analytic claims need citations.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
